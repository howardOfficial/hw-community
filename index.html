<head>

    <title>hw community</title>

    <!-- Шрифт Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Фирменный favicon hw community -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='25%25'%3E%3Cstop stop-color='%23a77bff'/%3E%3Cstop offset='1' stop-color='%23502bb5'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='17' fill='%230d0616'/%3E%3Crect x='3' y='3' width='58' height='58' rx='15' fill='url(%23g)'/%3E%3Cpath d='M15 19v26h7V34h9v11h7V19h-7v9h-9v-9zm27 0v26h7V34h2c6 0 9-3 9-8s-3-7-9-7z' fill='white'/%3E%3C/svg%3E">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background:
                radial-gradient(
                    ellipse at 50% 40%,
                    rgba(83, 44, 126, 0.13) 0%,
                    transparent 55%
                ),
                linear-gradient(145deg, #0d0616, #0a0512);

            color: #ffffff;
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 40px 20px;
        }

        main {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: rise-in 0.8s cubic-bezier(.2,.75,.25,1) both;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        :focus-visible {
            outline: 3px solid #d4baff;
            outline-offset: 4px;
            border-radius: 6px;
        }

        a {
            -webkit-tap-highlight-color: rgba(180, 140, 255, 0.22);
        }

        /* Главный заголовок */

        .logo {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 900;
            letter-spacing: -0.055em;
            line-height: 1.1;
            text-shadow: 0 0 40px rgba(180, 140, 255, 0.25);
        }

        /* SVG-волна */

        .wave {
            width: 100%;
            max-width: 320px;
            height: 35px;
            margin: 22px 0 12px;
        }

        .wave path {
            fill: none;
            stroke-linecap: round;
            pointer-events: none;
        }

        .wave-main {
            stroke: #c7a7ff;
            stroke-width: 2.4;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: draw 2s ease-out 0.2s forwards;
        }

        .wave-glow {
            stroke: #9b6cff;
            stroke-width: 7;
            opacity: 0.2;
            filter: blur(4px);
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        /* Подзаголовок */

        .subtitle {
            color: #aaa1b7;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        /* Проекты */

        .projects {
            margin-top: 95px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section-title {
            color: #c9a8ff;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .project-name {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .project-status {
            color: #b48cff;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 8px;
        }

        .project-countdown {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 12px;
        }

        /* Социальные кнопки */

        .socials {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 42px;
        }

        .social-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 46px;
            background: #7b4dff;
            color: #ffffff;

            padding: 12px 28px;
            border-radius: 999px;

            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 800;

            transition:
                background 0.25s ease,
                transform 0.25s ease,
                box-shadow 0.25s ease;

            box-shadow: 0 4px 20px rgba(123, 77, 255, 0.3);
        }

        .social-button:hover {
            background: #956fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(123, 77, 255, 0.45);
        }

        .social-button:active {
            transform: translateY(-1px) scale(0.98);
        }

        .social-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex: 0 0 auto;
        }

        .social-button:focus-visible {
            outline: 2px solid #c9a8ff;
            outline-offset: 4px;
        }

        /* Копирайт */

        footer {
            margin-top: 75px;
            color: #62596f;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Уважение к настройкам пользователя */

        @media (prefers-reduced-motion: reduce) {
            .wave-main {
                animation: none;
                stroke-dashoffset: 0;
            }

            main {
                animation: none;
            }

            .social-button {
                transition: none;
            }

            .social-button:hover {
                transform: none;
            }
        }

        /* Мобильная адаптация */

        @media (max-width: 480px) {
            body {
                padding: 35px 18px;
            }

            .projects {
                margin-top: 75px;
            }

            .socials {
                margin-top: 35px;
                gap: 12px;
            }

            .social-button {
                padding: 12px 24px;
            }

            footer {
                margin-top: 65px;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1 class="logo">hw community</h1>

        <svg
            class="wave"
            viewBox="0 0 320 35"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <path class="wave-main" d="
                M 0 18
                C 25 18, 35 3, 65 5
                S 102 31, 132 29
                S 171 2, 201 5
                S 238 31, 267 29
                S 296 14, 320 18
            "/>
            <path class="wave-glow" d="
                M 0 18
                C 25 18, 35 3, 65 5
                S 102 31, 132 29
                S 171 2, 201 5
                S 238 31, 267 29
                S 296 14, 320 18
            "/>
        </svg>

        <p class="subtitle">
            инди-студия одного человека
        </p>

        <section class="projects">

            <h2 class="section-title">Мои проекты</h2>

            <h3 class="project-name">Wave of Power</h3>

            <p class="project-status">
                в разработке
            </p>

            <p class="project-countdown" id="countdown" role="timer" aria-live="off" aria-label="Обратный отсчёт до альфа-тестирования">
                До альфы: <span id="countdown-value">45 дней</span>
            </p>

        </section>

        <nav class="socials" aria-label="Социальные сети">

            <a
                class="social-button"
                href="https://t.me/hw_gamedev"
                target="_blank"
                rel="noopener"
                aria-label="Открыть Telegram hw gamedev в новой вкладке"
            >
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.6 4.3 18.4 19c-.24 1.04-.86 1.3-1.74.8l-4.82-3.55-2.32 2.23c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.08-.55-.6-.2L6.2 12.7l-4.7-1.47c-1.02-.32-1.04-1.02.22-1.52L20.1 2.8c.85-.31 1.6.2 1.5 1.5Z"/>
                </svg>
                Telegram
            </a>

            <a
                class="social-button"
                href="https://youtube.com/@howardOriginal"
                target="_blank"
                rel="noopener"
                aria-label="Открыть YouTube-канал howardOriginal в новой вкладке"
            >
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.7V8.3l6.3 3.7-6.3 3.7Z"/>
                </svg>
                YouTube
            </a>

        </nav>

    </main>

    <footer>
        © 2026 hw community
    </footer>

    <script>
        (() => {
            // Дата альфа-тестирования: 19 декабря 2026 года.
            const targetDate = new Date('2026-12-19T00:00:00');
            const output = document.getElementById('countdown-value');
            if (!output) return;

            const plural = (number, forms) => {
                const n = Math.abs(number) % 100;
                const last = n % 10;
                if (n > 10 && n < 20) return forms[2];
                if (last > 1 && last < 5) return forms[1];
                if (last === 1) return forms[0];
                return forms[2];
            };

            const updateCountdown = () => {
                const remaining = targetDate.getTime() - Date.now();
                if (remaining <= 0) {
                    output.textContent = 'альфа уже должна была начаться';
                    return;
                }

                const days = Math.floor(remaining / 86400000);
                const hours = Math.floor((remaining % 86400000) / 3600000);
                const minutes = Math.floor((remaining % 3600000) / 60000);
                output.textContent =
                    `${days} ${plural(days, ['день', 'дня', 'дней'])} · ` +
                    `${hours} ч · ${minutes} мин`;
            };

            updateCountdown();
            window.setInterval(updateCountdown, 60000);
        })();
    </script>
</body>
</html>
